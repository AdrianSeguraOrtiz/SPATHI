[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spathi"
dynamic = ["version"]
description = "Similarity-weighted Population-Aware Transcriptional Heterogeneity Inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Adrián Segura" },
]
keywords = [
  "bioinformatics",
  "gene-regulatory-networks",
  "machine-learning",
  "single-cell-rna-seq",
  "transcriptomics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "threadpoolctl>=3.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/AdrianSeguraOrtiz/SPATHI"
Documentation = "https://github.com/AdrianSeguraOrtiz/SPATHI#readme"
Issues = "https://github.com/AdrianSeguraOrtiz/SPATHI/issues"
Repository = "https://github.com/AdrianSeguraOrtiz/SPATHI.git"

[project.scripts]
spathi = "spathi.cli:main"

[tool.hatch.version]
path = "src/spathi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spathi"]

[tool.hatch.build.targets.sdist]
include = [
  "/benchmarks",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "distribution: tests that build or inspect distribution artifacts",
  "integration: end-to-end tests that exercise multiple SPATHI components",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src/spathi"]
ignore_missing_imports = true
mypy_path = "src"
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
