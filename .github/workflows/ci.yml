name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types
        if: matrix.python-version == '3.11'
        run: mypy src/spathi

      - name: Run tests
        run: pytest -m "not distribution"

  distribution:
    name: Build and install distributions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/spathi-wheel-venv"
          "$RUNNER_TEMP/spathi-wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/spathi-wheel-venv/bin/python" -m pip install dist/*.whl

      - name: Smoke-test installed command and example
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/spathi-wheel-venv/bin/spathi" --version
          "$RUNNER_TEMP/spathi-wheel-venv/bin/spathi" --help
          "$RUNNER_TEMP/spathi-wheel-venv/bin/spathi" infer \
            --expression "$GITHUB_WORKSPACE/examples/minimal/expression.tsv" \
            --tf-list "$GITHUB_WORKSPACE/examples/minimal/tf_list.txt" \
            --groups "$GITHUB_WORKSPACE/examples/minimal/groups.tsv" \
            --output-dir "$RUNNER_TEMP/spathi-wheel-smoke" \
            --n-components 3 \
            --n-estimators 8 \
            --threads 1
          test -f "$RUNNER_TEMP/spathi-wheel-smoke/network.csv"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: spathi-distributions
          path: dist/*
          if-no-files-found: error
