name: Publish to PyPI

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install isolated build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Match the tag to a final package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import runpy

          from packaging.version import Version

          raw_version = runpy.run_path("src/spathi/_version.py")["__version__"]
          version = Version(raw_version)
          expected_tag = f"v{version}"
          if version.is_devrelease:
              raise SystemExit(f"development version {version} cannot be published")
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match {expected_tag!r}"
              )
          print(f"Validated release {version}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/spathi-release-venv"
          "$RUNNER_TEMP/spathi-release-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/spathi-release-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/spathi-release-venv/bin/python" -m pip check

      - name: Smoke-test the installed release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/spathi-release-venv/bin/python" - <<'PY'
          import os
          import spathi

          assert f"v{spathi.__version__}" == os.environ["RELEASE_TAG"]
          PY
          "$RUNNER_TEMP/spathi-release-venv/bin/spathi" --help
          "$RUNNER_TEMP/spathi-release-venv/bin/spathi" infer \
            --expression "$GITHUB_WORKSPACE/examples/minimal/expression.tsv" \
            --tf-list "$GITHUB_WORKSPACE/examples/minimal/tf_list.txt" \
            --groups "$GITHUB_WORKSPACE/examples/minimal/groups.tsv" \
            --output-dir "$RUNNER_TEMP/spathi-release-smoke" \
            --n-components 3 \
            --n-estimators 8 \
            --threads 1
          test -f "$RUNNER_TEMP/spathi-release-smoke/network.csv"

      - name: Store validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spathi-release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/spathi
    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spathi-release-distributions
          path: dist

      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
          attestations: true
